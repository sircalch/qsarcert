[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qsarcert"
version = "1.2.2"
description = "Automated OECD Validation Principles, Applicability Domain (Williams Plot), Y-Randomization, and Scaffold Leakage Certification for QSAR & Molecular ML Models"
readme = "README.md"
authors = [
    { name = "Andrés Monreal-Hernández", email = "andres.monreal@ues.mx" }
]
license = "MIT"
keywords = [
    "qsar",
    "qspr",
    "molecular-machine-learning",
    "applicability-domain",
    "williams-plot",
    "y-randomization",
    "tropsha-metrics",
    "oecd-principles",
    "cheminformatics",
    "drug-discovery",
    "model-validation",
    "conformal-prediction",
    "reproducibility"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent"
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0.0",
    "matplotlib>=3.5.0",
    "jinja2>=3.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "build>=0.10.0",
    "twine>=4.0.0"
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26"
]

[project.scripts]
qsarcert = "qsarcert.cli:main"

[project.urls]
Homepage = "https://github.com/sircalch/qsarcert"
Documentation = "https://sircalch.github.io/qsarcert/"
Repository = "https://github.com/sircalch/qsarcert.git"
"Bug Tracker" = "https://github.com/sircalch/qsarcert/issues"
Changelog = "https://github.com/sircalch/qsarcert/blob/master/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["qsarcert*"]


